<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coding Harness</title><link rel="stylesheet" href="/static/vendor/xterm.css"><link rel="stylesheet" href="/static/style.css"></head>
<body><header><span class="eyebrow">LOCAL DEVELOPMENT / PHASE 01</span><h1>AI Coding Harness</h1><p>Workspace를 선택하고 프로젝트 규칙과 함께 명령을 전달하세요.</p><span class="badge">MOCK ADAPTER · 외부 전송 없음</span></header>
<main><aside><h2>01 / Workspace</h2><label for="project">프로젝트 선택</label><select id="project"><option value="">선택하세요</option></select><form id="create"><label for="name">새 프로젝트</label><div class="row"><input id="name" required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}" placeholder="sample-project"><button>생성</button></div></form><label for="cwd">작업 디렉터리</label><input id="cwd" value="."><button id="reload" type="button">Rule 새로고침</button><h2>적용 Rule</h2><pre id="rules">Workspace 선택 대기</pre><h2>Context 파일 선택</h2><p class="hint">체크한 파일만 명령과 함께 전달합니다.</p><div id="files"></div></aside>
<section><h2>02 / Command console</h2><div id="terminal" aria-label="실행 결과"></div><pre id="fallback" hidden></pre><form id="command"><label for="text">명령</label><div class="row"><input id="text" required maxlength="8000" placeholder="이 프로젝트의 구현 계획을 정리해줘"><button id="run">실행 ↵</button></div></form><p id="status" role="status">Workspace를 선택하세요.</p><details><summary>파일 읽기 / 쓰기</summary><label for="path">Workspace 상대 경로</label><input id="path" placeholder="source/hello.txt"><label for="content">UTF-8 파일 내용</label><textarea id="content" rows="7"></textarea><button id="read" type="button">읽기</button> <button id="write" type="button">저장</button><p class="hint">저장은 파일을 덮어씁니다. 파일 읽기는 Context에 자동 추가되지 않습니다.</p></details></section></main><script src="/static/vendor/xterm.js"></script><script src="/static/app.js"></script></body></html>
