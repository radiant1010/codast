[project]
name = "ai-coding-harness"
version = "0.1.0"
description = "Local document-to-code harness, Phase 1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "detect-secrets==1.5.0",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

