sonar.projectKey=CODAST
sonar.projectName=CODAST
sonar.sourceEncoding=UTF-8

# Keep runtime data and private documents outside the analysis scope.
sonar.sources=app,start.py,codast.ps1,codast.cmd,codast.sh,scan_sonar.py,quality_check.py
sonar.tests=tests

# Third-party code and generated Python caches are not maintained here.
sonar.exclusions=app/web/static/vendor/**,**/__pycache__/**
sonar.test.exclusions=**/__pycache__/**

# Coverage currently measures Python application code; static analysis still covers the UI.
sonar.python.coverage.reportPaths=.local/sonar/coverage.xml
sonar.coverage.exclusions=start.py,scan_sonar.py,quality_check.py,app/web/static/**,app/web/templates/**
